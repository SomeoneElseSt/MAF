[project]
name = "maf"
version = "0.1.0"
description = "MAF, an anonymous forum for Minerva students"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "boto3>=1.35",
    "cryptography>=43",
    "presidio-analyzer>=2.2",
    "spacy>=3.8",
    # markdown in posts and replies (the browser uses markdown-it, the JS original, for private ones)
    "markdown-it-py[linkify]>=4.0",
    # the spaCy model Presidio uses. lg over md: md blocked "What is Kombucha?" and missed
    # "I saw Priya Raman at lunch"; lg gets both right at the same ~1 ms, for ~500 MB more memory.
    "en-core-web-lg>=3.8",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
maf = "maf.cli:main"
maf-mcp = "maf.mcp:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
