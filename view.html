<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAF Plan</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg: #fdfdfb; --text: #1f1f1f; --muted: #6b6b6b; --rule: #e4e2dc; --code: #f2f0ea; --accent: #b4532a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --text: #e8e6e1; --muted: #9a978f; --rule: #2e2d2a; --code: #222120; --accent: #e08a5f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; }
  nav { max-width: 760px; margin: 0 auto; padding: 16px 16px 0; font-size: 14px; color: var(--muted); }
  nav a { color: var(--accent); margin-right: 12px; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 64px; }
  h1 { font-size: 28px; margin: 24px 0 4px; }
  h2 { font-size: 20px; margin: 40px 0 8px; padding-top: 16px; border-top: 1px solid var(--rule); }
  a { color: var(--accent); }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.45; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; display: block; overflow-x: auto; }
  th, td { border-bottom: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
  li { margin: 4px 0; }
  input[type=checkbox] { margin-right: 6px; }
  .error { color: var(--accent); }
</style>
</head>
<body>
<nav><a href="?f=PLAN.md">PLAN.md</a><a href="?f=SPEC.md">SPEC.md</a></nav>
<main id="doc">Loading…</main>
<script>
  const ALLOWED_FILES = ["PLAN.md", "SPEC.md"];
  const requested = new URLSearchParams(location.search).get("f");
  const file = ALLOWED_FILES.includes(requested) ? requested : "PLAN.md";
  const target = document.getElementById("doc");

  fetch(file)
    .then(response => response.ok ? response.text() : Promise.reject(response.status))
    .then(markdown => { target.innerHTML = marked.parse(markdown); document.title = file.replace(".md", "") + " · MAF"; })
    .catch(status => { target.innerHTML = `<p class="error">Couldn't load ${file} (${status}). Serve this folder over HTTP: <code>python3 -m http.server 8000</code></p>`; });
</script>
</body>
</html>
