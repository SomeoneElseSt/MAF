{#
  email/base.html: the shared email layout, in the site's look (serif text, small grey sans notes).
  Always light, with the MAF wordmark top left as on the site. Styles are inline because many mail apps drop <style>.
  Blocks: content
#}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background:#ffffff; color:#000000;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
  <tr>
    <td style="padding:36px 24px;">
      <div style="max-width:480px; font:17px/1.6 'Iowan Old Style', Charter, 'Bitstream Charter', Cambria, Georgia, serif; color:#000000;">
<p style="margin:0 0 28px; font:700 24px/1.2 'Iowan Old Style', Charter, 'Bitstream Charter', Cambria, Georgia, serif; color:#000000;">{{ site_name }}</p>
{% block content %}{% endblock %}
      </div>
    </td>
  </tr>
</table>
</body>
</html>
