<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MAF</title>
<link rel="stylesheet" href="style.css">
<script>try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <button class="theme-toggle" type="button">Dark</button>
  </header>
  <main id="main">

  <h1 class="heading">Sign in</h1>
  <p class="lede">MAF is for Minerva students. Enter your university email and we'll send you a code. Your email is used once and never stored.</p>

  <form action="login-code.html">
    <div class="field">
      <label for="email">University email</label>
      <input id="email" type="email" placeholder="you@uni.minerva.edu" autocomplete="email">
    </div>
    <button class="button" type="submit">Send code</button>
  </form>

  <p class="small">Please don't name students or staff. Public figures are fine. <a href="how.html">How anonymity works</a></p>
  </main>
  <footer class="foot">
    <a href="about.html">About</a><a href="how.html">User Guide</a><a href="https://github.com/">Source Code</a>
  </footer>
</div>
<script src="theme.js"></script>
</body>
</html>
