<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MAF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <nav><a href="how.html">how it works</a></nav>
  </header>

  <h1 class="heading">Sign in</h1>
  <p class="lede">MAF is for Minerva students. Enter your university email and we'll send a code. The email is used once and never stored.</p>

  <form action="login-code.html">
    <div class="field">
      <label for="email">university email</label>
      <input id="email" type="email" placeholder="you@uni.minerva.edu" autocomplete="email">
    </div>
    <button class="button" type="submit">send code</button>
  </form>

  <p class="rule-line">rule: don't name students or staff. public figures are fine. · <a href="how.html">how anonymity works</a></p>
</div>
</body>
</html>
