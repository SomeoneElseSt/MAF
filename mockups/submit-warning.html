<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>New post · MAF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html"><span class="logo-mark">maf<span>.</span></span><span class="logo-sub">anonymous, students only</span></a>
    <nav class="nav">
      <a href="how.html">How it works</a>
      <a class="btn btn-primary" href="submit.html">New post</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 class="page-title">New post</h1>

  <div class="banner">
    <strong>This looks like it names someone</strong>
    <p>MAF doesn't allow naming students or staff. If it's a public figure, you can post anyway.</p>
    <div class="actions">
      <a class="btn" href="submit.html">Edit post</a>
      <a class="btn btn-primary" href="item.html">Post anyway</a>
    </div>

  <form class="card" action="item.html" style="margin-top: 16px">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" value="What Ben Nelson got right about seminars">
    </div>
    <div class="field">
      <label for="text">Text</label>
      <textarea id="text" class="body">Reading the founding essays again, the argument for active learning holds up better than I expected…</textarea>
    </div>
  </form>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>No names, no profiles, no tracking.</span>
    <span><a href="how.html">How it works</a> · <a href="https://github.com/">Source code</a></span>
  </div>
</footer>
