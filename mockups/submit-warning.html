<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit · MAF</title>
<link rel="stylesheet" href="style.css">
<script>try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}</script>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <nav><a href="submit.html" aria-current="page">Submit</a></nav>
    <form class="find" action="index.html"><input type="search" name="q" placeholder="Search" aria-label="Search posts and comments"></form>
    <button class="theme-toggle" type="button">Dark</button>
  </header>

  <h1 class="heading">Submit a post</h1>

  <div class="notice">
    <p>This looks like it names someone. MAF doesn't allow naming students or staff. If it's a public figure, you can post anyway.</p>
    <div class="row">
      <a class="button plain" href="submit.html">Edit post</a>
      <a class="button" href="item.html">Post anyway</a>
    </div>
  </div>

  <form action="item.html" style="margin-top: 26px">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" value="What Ben Nelson got right about seminars">
    </div>
    <div class="field">
      <label for="text">Text (optional)</label>
      <textarea id="text">Reading the founding essays again, the argument for active learning holds up better than I expected.</textarea>
    </div>
  </form>
</div>
<script src="theme.js"></script>
</body>
</html>
