<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit · MAF</title>
<link rel="stylesheet" href="style.css">
<script>try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}</script>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <nav><a href="submit.html" aria-current="page">Submit</a></nav>
    <form class="find" action="index.html"><input type="search" name="q" placeholder="Search" aria-label="Search posts and comments"></form>
    <button class="theme-toggle" type="button">Dark</button>
  </header>

  <h1 class="heading">Submit a post</h1>
  <p class="lede">Share a link, write something, or both. You'll get a random ID for this thread.</p>

  <form action="submit-warning.html">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" placeholder="What helped you settle into a new city fast?">
    </div>
    <div class="field">
      <label for="url">Link (optional)</label>
      <input id="url" type="url" placeholder="https://en.wikipedia.org/wiki/Culture_shock">
    </div>
    <div class="field">
      <label for="tags">Hashtags (optional)</label>
      <input id="tags" type="text" placeholder="#life, #berlin">
      <p class="help">Up to 3, separated by commas.</p>
    </div>
    <div class="field">
      <label for="text">Text (optional)</label>
      <textarea id="text"></textarea>
      <p class="help">Please don't name students or staff.</p>
    </div>
    <div class="row">
      <button class="button" type="submit">Submit</button>
      <a class="note" href="index.html">Cancel</a>
    </div>
  </form>
  <footer class="foot">
    <a href="about.html">About</a><a href="how.html">User Guide</a><a href="https://github.com/">Source Code</a>
  </footer>
</div>
<script src="theme.js"></script>
<script>
  // Mockup-only: with no hashtags the Text box shows an example post; once tags are added it shows a template. Tags with their own template (only #hottakes for now) swap it in.
  const EXAMPLE = "Every rotation I spend the first few weeks feeling lost. Curious which routines, apps or places made the move easier for you.";
  const TEMPLATES = {
    default: [
      "- What it's about",
      "- Your claim or question",
      "- What kind of conversation you'd like: debate, advice, or just sharing",
    ],
    hottakes: [
      "- My take in one sentence",
      "- Why I think this, with one experience or piece of evidence",
      "- The strongest argument against my take, as I understand it",
      "- What could change my mind, and whether I want debate, advice, or just listening",
    ],
  };
  const tagsInput = document.getElementById("tags");
  const textBox = document.getElementById("text");

  function applyTemplate() {
    if (tagsInput.value.trim() === "") {
      textBox.placeholder = EXAMPLE;
      return;
    }
    const tags = tagsInput.value.toLowerCase().split(/[\s,]+/).map(tag => tag.replace(/^#/, ""));
    const template = tags.includes("hottakes") ? TEMPLATES.hottakes : TEMPLATES.default;
    textBox.placeholder = template.join("\n");
  }

  tagsInput.addEventListener("input", applyTemplate);
  applyTemplate();
</script>

</body>
</html>
