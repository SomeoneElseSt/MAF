<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit · MAF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <nav><a href="submit.html" aria-current="page">submit</a><a href="how.html">how it works</a></nav>
    <form class="find" action="index.html"><input type="search" name="q" placeholder="search" aria-label="Search posts and comments"></form>
  </header>

  <h1 class="heading">Submit</h1>
  <p class="lede">A link, some text, or both.</p>

  <form action="submit-warning.html">
    <div class="field">
      <label for="title">title</label>
      <input id="title" type="text" value="Unpopular opinion: the capstone should be optional">
    </div>
    <div class="field">
      <label for="url">link</label>
      <input id="url" type="url" placeholder="https://">
    </div>
    <div class="field">
      <label for="text">text</label>
      <textarea id="text">I know this will be controversial, but after talking to people in my cohort, the capstone feels like a requirement that helps some students and drains others.</textarea>
      <p class="help">plain text · no images</p>
    </div>
    <div class="row">
      <button class="button" type="submit">submit</button>
      <a class="note" href="index.html">cancel</a>
    </div>
  </form>

  <p class="rule-line">rule: don't name students or staff. public figures are fine.</p>
</div>
</body>
</html>
