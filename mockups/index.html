<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAF</title>
<link rel="stylesheet" href="style.css">
<script>try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}</script>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <nav><a href="submit.html">Submit</a></nav>
    <form class="find" action="index.html"><input type="search" name="q" placeholder="Search" aria-label="Search posts and comments"></form>
    <button class="theme-toggle" type="button">Dark</button>
  </header>

  <section class="empty">
    <p class="empty-title">No posts yet.</p>
    <p class="empty-sub"><a href="submit.html">Start the first thread</a></p>
  </section>

  <footer class="foot">
    <a href="about.html">About</a><a href="how.html">User Guide</a><a href="https://github.com/">Source Code</a>
  </footer>
</div>
<script src="theme.js"></script>
</body>
</html>
