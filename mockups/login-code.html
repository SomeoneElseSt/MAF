<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter code · MAF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <nav><a href="how.html">how it works</a></nav>
  </header>

  <h1 class="heading">Check your inbox</h1>
  <p class="lede">We sent a 6-digit code. It works for 10 minutes. If it's not there, check spam.</p>

  <form action="index.html">
    <div class="field">
      <label for="code">code</label>
      <input id="code" class="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    </div>
    <div class="row">
      <button class="button" type="submit">continue</button>
      <a class="note" href="login.html">use a different email</a>
    </div>
  </form>
</div>
</body>
</html>
