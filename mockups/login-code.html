<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter code · MAF</title>
<link rel="stylesheet" href="style.css">
<script>try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html">MAF</a>
    <button class="theme-toggle" type="button">Dark</button>
  </header>
  <main id="main">

  <h1 class="heading">Check your inbox</h1>
  <p class="lede">We sent you a 6-digit code. It works for 10 minutes. If you can't find it, check your spam folder.</p>

  <form action="index.html">
    <div class="field">
      <label for="code">Code</label>
      <input id="code" class="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    </div>
    <div class="row">
      <button class="button" type="submit">Continue</button>
      <a class="note" href="login.html">Use a different email</a>
    </div>
  </form>
  </main>
  <footer class="foot">
    <a href="about.html">About</a><a href="how.html">User Guide</a><a href="https://github.com/SomeoneElseSt/MAF">Source Code</a>
  </footer>
</div>
<script src="theme.js"></script>
</body>
</html>
