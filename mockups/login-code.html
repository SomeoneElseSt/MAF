<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter code · MAF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html"><span class="logo-mark">maf<span>.</span></span><span class="logo-sub">anonymous, students only</span></a>
    <nav class="nav"><a href="how.html">How it works</a></nav>
  </div>
</header>

<main class="wrap narrow">
  <h1 class="page-title">Check your inbox</h1>
  <p class="page-lead">We sent a 6-digit code to your university email. It expires in 10 minutes.</p>

  <form class="card" action="index.html">
    <div class="field">
      <label for="code">Code</label>
      <input id="code" class="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
    </div>
    <button class="btn btn-primary btn-block" type="submit">Continue</button>
  </form>

  <p class="fine">Nothing arrived? Check spam, or <a href="login.html">try again</a> in 10 minutes.</p>
</main>
</body>
</html>
